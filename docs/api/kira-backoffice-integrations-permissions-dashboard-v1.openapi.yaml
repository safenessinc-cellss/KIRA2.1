openapi: 3.1.0
info:
  title: KIRA Backoffice Integrations, RBAC and Dashboard API
  version: 1.0.0
servers:
  - url: https://kira.coach
security:
  - FirebaseBearer: []
paths:
  /api/admin/permissions/seed:
    post:
      summary: Apply the reviewed role permission seed to Firestore
      responses:
        '200': { description: Seed applied and audited }
        '403': { description: Superadmin with recent MFA required }
  /api/admin/permissions/{role}:
    patch:
      summary: Update one role permission map
      parameters:
        - in: path
          name: role
          required: true
          schema: { type: string }
      responses:
        '200': { description: Updated and audited }
        '400': { description: Invalid role or permission map }
        '403': { description: Superadmin with recent MFA required }
  /api/public/landing/{slug}:
    post:
      security: []
      summary: Accept a public landing form with honeypot and CAPTCHA validation
      responses:
        '201': { description: Lead accepted }
        '410': { description: Form or integration disabled }
        '429': { description: Rate limit exceeded }
  /api/webhooks/whatsapp:
    post:
      security: []
      summary: Receive a timestamped HMAC-SHA256 WhatsApp event
      responses:
        '200': { description: Event accepted or duplicate }
        '401': { description: Invalid signature or stale timestamp }
        '410': { description: Provider integration disabled }
        '429': { description: Rate limit exceeded }
  /api/cron/dashboard/refresh:
    post:
      summary: Reconcile persisted dashboard aggregates
      responses:
        '200': { description: Aggregate refresh complete }
        '401': { description: Invalid cron credential }
components:
  securitySchemes:
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID Token
