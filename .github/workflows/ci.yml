name: KIRA CI

on:
  pull_request:
    branches: [main, "feat/master-prompt-implementation-phase1"]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: write

concurrency:
  group: kira-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies and reconcile lockfile
        run: npm install --no-audit --no-fund
      - name: Commit reconciled lockfile to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          cp package-lock.json /tmp/kira-package-lock.json
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "FETCH_HEAD"
          cp /tmp/kira-package-lock.json package-lock.json
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: sync npm lockfile [skip ci]"
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
          fi
      - name: Install from synchronized lockfile
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
