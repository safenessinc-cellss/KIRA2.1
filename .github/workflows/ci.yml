name: KIRA CI

on:
  pull_request:
    branches: [main, "feat/master-prompt-implementation-phase1"]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

concurrency:
  group: kira-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: TypeScript and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
