name: KIRA 2.1 Release Verification

on:
  push:
    branches: [release/v2.1.0]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "server.ts"
      - "server/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"

permissions:
  contents: read

concurrency:
  group: kira-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript and lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Domain and Firestore rules tests
        run: npm run test:all
      - name: Client bundle secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'AIza[0-9A-Za-z_-]{20,}|sk_live_[0-9A-Za-z]+|sk_test_[0-9A-Za-z]+' src dist; then
            echo "Potential credential literal found in client source or build output."
            exit 1
          fi
          echo "No credential literals found in src/ or dist/."
