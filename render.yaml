services:
  - type: web
    name: kira-2-1-staging
    runtime: node
    plan: free
    branch: deploy/kira-render-staging
    buildCommand: npm install --no-audit --no-fund && npm run build:test && npm run verify:pwa
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: KIRA_DEMO_MODE
        value: "true"
      - key: PORT
        value: "10000"
      # Use a SEPARATE Firebase project for staging; never point tests at production data.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: KIRA_APP_URL
        sync: false
      # Optional integrations: add their staging/sandbox credentials in Render.
      - key: GEMINI_API_KEY
        sync: false
      - key: KIRA_CERTIFICATE_SIGNING_SECRET
        sync: false
      - key: KIRA_CONFIG_ENCRYPTION_KEY
        sync: false
      - key: KIRA_CRM_PII_ENCRYPTION_KEY
        sync: false
      - key: KIRA_OUTBOX_CRON_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: LANDING_CAPTCHA_SECRET
        sync: false
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
